# Firebase App Hosting 설정
# - NEXT_PUBLIC_* 값(공개 키)은 Firebase 콘솔 → App Hosting → 백엔드 → 설정 → 환경에 입력하세요.
# - 아래 비밀 키는 `firebase apphosting:secrets:set <이름>` 으로 Cloud Secret Manager 에 저장합니다.

runConfig:
  minInstances: 0     # 요청이 없으면 0대로 줄여 비용 절약 (첫 접속이 몇 초 느릴 수 있음)
  maxInstances: 2     # 트래픽 폭주 시 비용 상한
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── 서버 전용 비밀 키 (브라우저에 노출되지 않음) ──
  - variable: KAKAO_REST_KEY
    secret: KAKAO_REST_KEY
    availability: [RUNTIME]
  - variable: ODSAY_API_KEY
    secret: ODSAY_API_KEY
    availability: [RUNTIME]
  - variable: OPENWEATHER_API_KEY
    secret: OPENWEATHER_API_KEY
    availability: [RUNTIME]
