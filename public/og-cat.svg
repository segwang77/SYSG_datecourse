<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="0.55" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- 하트 (기준점: 가운데, 크기 약 40) -->
    <path id="heart" d="M0 14 C -22 -2 -20 -20 -9 -20 C -3 -20 0 -15 0 -12 C 0 -15 3 -20 9 -20 C 20 -20 22 -2 0 14 Z"/>

    <!-- 발바닥 (기준점: 가운데, 크기 약 40) -->
    <g id="paw">
      <ellipse cx="0" cy="8" rx="11" ry="9"/>
      <ellipse cx="-14" cy="-5" rx="5" ry="6.5"/>
      <ellipse cx="-5" cy="-13" rx="5" ry="6.5"/>
      <ellipse cx="5" cy="-13" rx="5" ry="6.5"/>
      <ellipse cx="14" cy="-5" rx="5" ry="6.5"/>
    </g>

    <!-- 지도 핀 (기준점: 핀 끝) -->
    <g id="pin">
      <path d="M0 0 C -6 -14 -24 -24 -24 -44 A 24 24 0 0 1 24 -44 C 24 -24 6 -14 0 0 Z" fill="#f43f5e"/>
      <circle cx="0" cy="-44" r="15" fill="#fff"/>
    </g>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="190" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="600" r="150" fill="#fff" opacity="0.3"/>

  <!-- 배경 장식: 하트와 발바닥 -->
  <g fill="#fb7185" opacity="0.22">
    <use xlink:href="#heart" href="#heart" transform="translate(70 80) scale(1.1) rotate(-12)"/>
    <use xlink:href="#heart" href="#heart" transform="translate(560 70) scale(0.8) rotate(10)"/>
    <use xlink:href="#heart" href="#heart" transform="translate(1130 300) scale(0.9) rotate(14)"/>
    <use xlink:href="#heart" href="#heart" transform="translate(640 420) scale(0.7) rotate(-8)"/>
    <use xlink:href="#paw" href="#paw" transform="translate(300 70) rotate(-18)"/>
    <use xlink:href="#paw" href="#paw" transform="translate(680 190) scale(0.85) rotate(20)"/>
    <use xlink:href="#paw" href="#paw" transform="translate(1150 590) scale(0.8) rotate(-10)"/>
    <use xlink:href="#paw" href="#paw" transform="translate(486 452) scale(0.7) rotate(24)"/>
  </g>

  <!-- 글자 영역 -->
  <g font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <rect x="80" y="118" width="212" height="44" rx="22" fill="#fff"/>
    <text x="186" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#e11d48" letter-spacing="3">DATE COURSE</text>

    <!-- 제목: SY ♥ SG (하트는 글꼴에 상관없이 똑같이 보이도록 도형으로 그림) -->
    <text x="76" y="270" font-size="124" font-weight="900" fill="#e11d48" letter-spacing="6">SY</text>
    <use xlink:href="#heart" href="#heart" transform="translate(311 232) scale(2.5)" fill="#f43f5e"/>
    <text x="388" y="270" font-size="124" font-weight="900" fill="#e11d48" letter-spacing="6">SG</text>
    <text x="80" y="330" font-size="38" font-weight="600" fill="#9f1239">지도로 짜는 우리 둘의 하루</text>

    <!-- 동선 · 시간 · 비용 -->
    <g font-size="24" font-weight="600" fill="#be123c" text-anchor="middle">
      <rect x="80" y="368" width="104" height="48" rx="24" fill="#fff" opacity="0.85"/>
      <text x="132" y="400">동선</text>
      <rect x="198" y="368" width="104" height="48" rx="24" fill="#fff" opacity="0.85"/>
      <text x="250" y="400">시간</text>
      <rect x="316" y="368" width="104" height="48" rx="24" fill="#fff" opacity="0.85"/>
      <text x="368" y="400">비용</text>
    </g>

    <!-- 코스 경로: 1 → 2 → 3 -->
    <path d="M 110 548 C 200 480 290 600 380 536 S 520 500 590 548" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16"/>
    <g font-size="20" font-weight="800" fill="#e11d48" text-anchor="middle">
      <use xlink:href="#pin" href="#pin" transform="translate(110 548)"/>
      <text x="110" y="511">1</text>
      <use xlink:href="#pin" href="#pin" transform="translate(380 536)"/>
      <text x="380" y="499">2</text>
      <use xlink:href="#pin" href="#pin" transform="translate(590 548)"/>
      <text x="590" y="511">3</text>
    </g>
  </g>

  <!-- 바닥 그림자 -->
  <ellipse cx="898" cy="588" rx="262" ry="20" fill="#fb7185" opacity="0.18"/>

  <!-- 고양이 1: 크림색 줄무늬, 웃는 눈 -->
  <g transform="translate(782 370)">
    <path d="M -55 150 C -130 150 -140 70 -104 44" fill="none" stroke="#f6c58f" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="0" cy="125" rx="72" ry="80" fill="#fde8c9"/>
    <ellipse cx="0" cy="142" rx="42" ry="52" fill="#fff8ec"/>
    <ellipse cx="-30" cy="198" rx="25" ry="14" fill="#fff8ec"/>
    <ellipse cx="30" cy="198" rx="25" ry="14" fill="#fff8ec"/>
    <path d="M -74 -24 L -60 -98 L -14 -60 Z" fill="#fde8c9" stroke="#fde8c9" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 74 -24 L 60 -98 L 14 -60 Z" fill="#fde8c9" stroke="#fde8c9" stroke-width="10" stroke-linejoin="round"/>
    <path d="M -62 -40 L -55 -78 L -32 -58 Z" fill="#fda4af"/>
    <path d="M 62 -40 L 55 -78 L 32 -58 Z" fill="#fda4af"/>
    <ellipse cx="0" cy="0" rx="90" ry="74" fill="#fde8c9"/>
    <g stroke="#f0a95f" stroke-width="8" stroke-linecap="round">
      <path d="M -16 -66 L -13 -48"/><path d="M 0 -70 L 0 -50"/><path d="M 16 -66 L 13 -48"/>
    </g>
    <g fill="none" stroke="#5b4636" stroke-width="5.5" stroke-linecap="round">
      <path d="M -44 -2 Q -31 -18 -18 -2"/>
      <path d="M 18 -2 Q 31 -18 44 -2"/>
      <path d="M 0 24 Q -8 34 -17 26"/>
      <path d="M 0 24 Q 8 34 17 26"/>
    </g>
    <path d="M -7 14 H 7 L 0 23 Z" fill="#f472b6" stroke="#f472b6" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="-54" cy="20" rx="14" ry="9" fill="#fda4af" opacity="0.75"/>
    <ellipse cx="54" cy="20" rx="14" ry="9" fill="#fda4af" opacity="0.75"/>
    <g stroke="#d9b98f" stroke-width="3" stroke-linecap="round">
      <path d="M -70 6 L -108 0"/><path d="M -70 18 L -108 22"/>
      <path d="M 70 6 L 108 0"/><path d="M 70 18 L 108 22"/>
    </g>
  </g>

  <!-- 고양이 2: 회색 줄무늬, 동그란 눈 -->
  <g transform="translate(1014 382)">
    <path d="M 55 150 C 130 150 140 70 104 44" fill="none" stroke="#aab2c0" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="0" cy="118" rx="70" ry="76" fill="#d5dae3"/>
    <ellipse cx="0" cy="134" rx="40" ry="50" fill="#f4f6f9"/>
    <ellipse cx="-29" cy="187" rx="24" ry="14" fill="#f4f6f9"/>
    <ellipse cx="29" cy="187" rx="24" ry="14" fill="#f4f6f9"/>
    <path d="M -72 -24 L -58 -96 L -14 -58 Z" fill="#d5dae3" stroke="#d5dae3" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 72 -24 L 58 -96 L 14 -58 Z" fill="#d5dae3" stroke="#d5dae3" stroke-width="10" stroke-linejoin="round"/>
    <path d="M -60 -40 L -53 -76 L -31 -57 Z" fill="#fda4af"/>
    <path d="M 60 -40 L 53 -76 L 31 -57 Z" fill="#fda4af"/>
    <ellipse cx="0" cy="0" rx="88" ry="72" fill="#d5dae3"/>
    <g stroke="#98a2b3" stroke-width="8" stroke-linecap="round">
      <path d="M -16 -64 L -13 -46"/><path d="M 0 -68 L 0 -48"/><path d="M 16 -64 L 13 -46"/>
    </g>
    <circle cx="-31" cy="-4" r="10" fill="#3f3a45"/>
    <circle cx="31" cy="-4" r="10" fill="#3f3a45"/>
    <circle cx="-27.500" cy="-7.500" r="3.200" fill="#fff"/>
    <circle cx="34.500" cy="-7.500" r="3.200" fill="#fff"/>
    <g fill="none" stroke="#3f3a45" stroke-width="5.500" stroke-linecap="round">
      <path d="M 0 24 Q -8 34 -17 26"/>
      <path d="M 0 24 Q 8 34 17 26"/>
    </g>
    <path d="M -7 14 H 7 L 0 23 Z" fill="#f472b6" stroke="#f472b6" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="-54" cy="20" rx="14" ry="9" fill="#fda4af" opacity="0.75"/>
    <ellipse cx="54" cy="20" rx="14" ry="9" fill="#fda4af" opacity="0.75"/>
    <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round">
      <path d="M -70 6 L -108 0"/><path d="M -70 18 L -108 22"/>
      <path d="M 70 6 L 108 0"/><path d="M 70 18 L 108 22"/>
    </g>
  </g>

  <!-- 두 고양이 사이 하트 -->
  <g fill="#f43f5e">
    <use xlink:href="#heart" href="#heart" transform="translate(898 228) scale(2.3)"/>
    <use xlink:href="#heart" href="#heart" transform="translate(958 176) scale(1.1) rotate(14)" opacity="0.7"/>
    <use xlink:href="#heart" href="#heart" transform="translate(846 170) scale(0.8) rotate(-14)" opacity="0.5"/>
  </g>
</svg>
